# intro_skip: skip startup logo texture loads and splash wait branch.
[mod]
id = "eu.savagecore.intro_skip"
version = "0.1.0"
label = "Intro Skip"
description = "Skips the No Man's Sky startup logos."
enabled = true

[[setting]]
id = "logo-texture"
kind = "bool"
label = "Skip logo textures"
description = "Skip the startup logo loads."
default = true

[[setting]]
id = "logo-wait"
kind = "bool"
label = "Skip splash wait"
description = "Skip the splash-screen wait branch."
default = true

[[patch]]
id = "logo-texture"
op = "force-branch"
pattern = "48 3b df 0f 84 ?? ?? ?? ?? 45 33 ed 44 38 2b 0f 84 ?? ?? ?? ??"
offset = 15

[[patch]]
id = "logo-wait"
op = "write-bytes"
pattern = "83 f9 05 74 ?? 83 f9 06 74 ?? 44 38 ?? ?? ?? ?? ?? 0f 84 ?? ?? ?? ??"
offset = 17
expect = "0f 84"
bytes = "66 0f 1f 44 00 00"
