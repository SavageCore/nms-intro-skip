[[patch]]
id = "logo-texture"
op = "force-branch"
pattern = "48 3b df 0f 84 ?? ?? ?? ?? 45 33 ed 44 38 2b 0f 84 ?? ?? ?? ??"
offset = 15

[[patch]]
id = "logo-wait"
op = "write-bytes"
pattern = "83 f9 05 74 ?? 83 f9 06 74 ?? 44 38 ?? ?? ?? ?? ?? 0f 84 ?? ?? ?? ??"
offset = 17
expect = "0f 84"
bytes = "66 0f 1f 44 00 00"
